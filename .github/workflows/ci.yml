# Testes, tipagem, lint e build do Next em cada PR e em cada push na main e na release.
# Depois do build, o teste de fluxo (Playwright) joga uma partida com dois
# navegadores e guarda um print de cada tela no artefato "prints-do-fluxo".
# O `next build` só rodava no deploy do Render; aqui ele quebra antes do merge.
name: CI

on:
  push:
    branches: [main, release]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Testes, tipagem, lint e build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # metadataBase do layout (og:image). Só precisa ser uma URL válida no build
      # da CI; em produção vem de RENDER_EXTERNAL_URL ou do SITE_URL real.
      SITE_URL: https://syntonize.example.com
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testes
        run: npm test

      - name: Tipagem do servidor
        run: npm run typecheck:server

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Depois do build: o `next-env.d.ts` (tipos de CSS modules e imagens) é
      # gerado pelo Next e fica fora do git.
      - name: Tipagem do cliente
        run: npm run typecheck

      - name: Tipagem do teste de fluxo
        run: npm run typecheck:e2e

      - name: Chromium do Playwright
        run: npx playwright install --with-deps chromium

      # Sobe o servidor de produção do build acima (sem Redis) e joga a partida
      # no desktop e no celular, nos temas escuro e claro.
      - name: Teste de fluxo com prints
        run: npm run e2e

      - name: Guardar os prints
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: prints-do-fluxo
          path: |
            e2e/prints/
            e2e/report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Resumo
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Prints do fluxo"
            echo ""
            echo "Baixe o artefato **prints-do-fluxo** e abra \`e2e/prints/index.html\` (galeria) ou \`e2e/report/index.html\` (relatório do Playwright, com os prints de cada passo)."
            echo ""
            for d in e2e/prints/*/; do [ -d "$d" ] && echo "- $(basename "$d"): $(ls "$d"*.png 2>/dev/null | wc -l) prints"; done
          } >> "$GITHUB_STEP_SUMMARY"
